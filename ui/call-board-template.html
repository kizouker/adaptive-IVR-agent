<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="3">
<title>Holdmate live board</title>
<style>
  body { background: #101418; color: #e8eaed; margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    color: #7ee2a8; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
  .spacer { flex: 1; }
  .lang button { background: #1c232e; color: #e8eaed; border: 1px solid #39424f;
    padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .lang button.on { background: #0f766e; border-color: #0f766e; }
  .sub { color: #9aa3af; font-size: 13px; margin: 4px 0 16px; }
  h2 { font-size: 14px; font-weight: 600; color: #c8cfd8; margin: 22px 0 10px; }
  .pipe { display: flex; align-items: stretch; gap: 0; margin-bottom: 6px; }
  .node { flex: 1; text-align: center; padding: 10px 6px; font-size: 13px;
    background: #1c232e; border: 1px solid #39424f; }
  .node:first-child { border-radius: 8px 0 0 8px; }
  .node:last-child { border-radius: 0 8px 8px 0; }
  .node .n { display: block; font-size: 11px; color: #9aa3af; margin-bottom: 2px; }
  .node.done { background: #123b36; border-color: #0f766e; }
  .node.current { background: #3d2f10; border: 2px solid #f59e0b; padding: 9px 5px; }
  .card { background: #1a2029; border: 1px solid #2c3542; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .card .errand { color: #9aa3af; font-size: 13px; margin-bottom: 10px; }
  .turn { margin: 10px 0; }
  .who { font-size: 12px; color: #9aa3af; margin-bottom: 3px; }
  .bubble { display: inline-block; max-width: 85%; padding: 8px 12px;
    font-size: 14px; }
  .caller .bubble { background: #243447; border-radius: 4px 14px 14px 14px; }
  .robot { text-align: right; }
  .robot .bubble { background: #1f3d2b; border-radius: 14px 14px 4px 14px;
    text-align: left; }
  .meta { margin-top: 4px; display: flex; gap: 8px; font-size: 12px;
    color: #9aa3af; align-items: center; }
  .robot .meta { justify-content: flex-end; }
  .badge { background: #39424f; color: #e8eaed; padding: 2px 8px;
    border-radius: 20px; }
  .kw-ok { color: #7ee2a8; }
  .kw-miss { color: #9aa3af; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title"></h1>
    <span class="live"><span class="dot"></span><span id="live"></span></span>
    <span class="spacer"></span>
    <span class="lang"><button id="btn-sv">SV</button><button id="btn-en">EN</button></span>
  </div>
  <div class="sub" id="generated"></div>
  <h2 id="process-h"></h2>
  <div class="pipe" id="pipe"></div>
  <h2 id="calls-h"></h2>
  <div id="calls"></div>
</div>
<script>
window.__CALLS__ = __STATE_JSON__;
var T = {
  sv: { title: "Holdmate liveboard", live: "live", process: "Processen",
    calls: "Samtalen", errand: "Ärende", state: "Steg", routed: "styrt mot ärendet",
    missed: "uppfattades inte", caller: "Uppringare (Oskar)", robot: "AF Agda (Alva)",
    generated: "Uppdaterad", level: "Nivå" },
  en: { title: "Holdmate live board", live: "live", process: "The process",
    calls: "The calls", errand: "Errand", state: "Step", routed: "routed to errand",
    missed: "not understood", caller: "Caller (Oskar)", robot: "AF Agda (Alva)",
    generated: "Updated", level: "Level" }
};
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function render(lang) {
  var t = T[lang] || T.sv;
  var data = window.__CALLS__;
  document.getElementById("title").textContent = t.title;
  document.getElementById("live").textContent = t.live;
  document.getElementById("process-h").textContent = t.process;
  document.getElementById("calls-h").textContent = t.calls;
  document.getElementById("generated").textContent =
    t.generated + " " + data.generated;
  document.getElementById("btn-sv").className = lang === "sv" ? "on" : "";
  document.getElementById("btn-en").className = lang === "en" ? "on" : "";
  var live = data.calls[data.calls.length - 1];
  var map = data.maps[live.map];
  var order = [];
  var seen = {};
  var i;
  for (i = 0; i < map.states.length; i++) { order.push(map.states[i].id); }
  var pos = order.indexOf(live.position);
  var html = "";
  for (i = 0; i < map.states.length; i++) {
    var st = map.states[i];
    var cls = i < pos ? "node done" : (i === pos ? "node current" : "node");
    html += '<div class="' + cls + '"><span class="n">' + t.level + " " +
      (i + 1) + "</span>" + esc(st[lang]) + "</div>";
  }
  document.getElementById("pipe").innerHTML = html;
  var out = "";
  for (var c = 0; c < data.calls.length; c++) {
    var call = data.calls[c];
    out += '<div class="card"><h3>' + esc(call.label) + "</h3>" +
      '<div class="errand">' + t.errand + ": " + esc(call.errand) + "</div>";
    for (var k = 0; k < call.turns.length; k++) {
      var turn = call.turns[k];
      var statename = turn.state_name[lang] || turn.state_name.sv;
      out += '<div class="turn caller"><div class="who">' + t.caller + "</div>" +
        '<div class="bubble">' + esc(turn.caller) + "</div></div>";
      var kw = turn.matched
        ? '<span class="kw-ok">' + esc(turn.caller) + " → " + t.routed + "</span>"
        : '<span class="kw-miss">' + t.missed + "</span>";
      out += '<div class="turn robot"><div class="who">' + t.robot + "</div>" +
        '<div class="bubble">' + esc(turn.robot) + "</div>" +
        '<div class="meta"><span class="badge">' + t.state + ": " +
        esc(statename) + "</span>" + kw + "</div></div>";
    }
    out += "</div>";
  }
  document.getElementById("calls").innerHTML = out;
}
function currentLang() {
  return (typeof location !== "undefined" && location.hash === "#en") ? "en" : "sv";
}
document.getElementById("btn-sv").addEventListener("click", function () {
  location.hash = "#sv"; render("sv");
});
document.getElementById("btn-en").addEventListener("click", function () {
  location.hash = "#en"; render("en");
});
render(currentLang());
</script>
</body>
</html>
