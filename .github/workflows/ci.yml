name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: pip install -e .

      - name: Requirement coverage
        run: ./sh/check-reqs.sh

      - name: Shell syntax and lint
        run: |
          for f in sh/*.sh; do bash -n "$f"; done
          sudo apt-get install -y shellcheck
          shellcheck -S warning sh/*.sh

      - name: Structure and security
        run: ./sh/check-structure.sh && ./sh/check-security.sh && ./sh/check-prompts.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/board/package-lock.json

      - name: Board lint and audit
        run: |
          npm ci --prefix ui/board
          npm run lint --prefix ui/board
          npm audit --prefix ui/board --omit=dev --audit-level=high

      - name: Python security audit
        run: |
          pip install bandit pip-audit
          bandit -r src -ll -q
          pip-audit

      - name: Tests
        run: |
          if [ -d tests ]; then pip install pytest coverage && coverage run --source=src -m pytest -q 2>&1 | tee /tmp/pytest.log; else echo "no tests yet"; fi

      - name: Test stats
        if: always()
        run: |
          TESTS="$(grep -E 'passed|failed|error' /tmp/pytest.log 2>/dev/null | tail -1 | sed 's/^ *//')"
          [ -n "$TESTS" ] || TESTS="n/a"
          COV="$(coverage report 2>/dev/null | awk '$1 == "TOTAL" { print $NF }')"
          [ -n "$COV" ] || COV="n/a"
          {
            echo "## Test stats"
            echo ""
            echo "| Measure | Value |"
            echo "|---|---|"
            echo "| Tests (pytest) | $TESTS |"
            echo "| Coverage (src) | $COV |"
          } >> "$GITHUB_STEP_SUMMARY"
