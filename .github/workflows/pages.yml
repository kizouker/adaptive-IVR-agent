name: Board

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/board/package-lock.json

      - name: Install board deps
        run: npm ci --prefix ui/board

      - name: Build with generated lessons
        run: |
          pip install -e .
          PYTHONPATH=src python3 -m adaptive_ivr_agent.holdmate \
            --phrasebooks data/role-phrasebooks.json \
            --lines data/doorkeeper-lines.json \
            --knowledge /tmp/pages-knowledge.json \
            --lessons /tmp/pages-lessons.jsonl \
            --fresh --depth 2 \
            --board-out ui/board/public/board-state.json \
            || cp ui/board/public/board-state.sample.json ui/board/public/board-state.json
          python3 sh/bake-board.py --board ui/board/public/board-state.json --lines data/doorkeeper-lines.json
          printf '{"version":"%s","built":"%s"}\n' "$(git describe --tags --always --dirty)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ui/board/public/version.json
          npm run build --prefix ui/board

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/board/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
