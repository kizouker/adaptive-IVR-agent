# Holdmate live app (the board) in one command.
services:
  # Replay: self-call + offline eval + pytest in one command.
  #   docker compose run --rm replay
  replay:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - .:/repo
    command: >
      bash -c "pip install --no-cache-dir -q pytest && bash sh/replay.sh"
  board:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BOARD_PORT:-8080}:80"
    restart: unless-stopped
